<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#22252a;--sub:#646a73;--line:#dfdedA;--accent:#1f5f8b;--accent-ink:#fff;--soft:#e4eff6;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#17191c;--card:#212428;--ink:#eceef1;--sub:#a3a9b2;--line:#363a40;--accent:#7dbbe3;--accent-ink:#10222e;--soft:#26343e;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 4px}
h2{font-size:1rem;margin:0 0 10px}
.sub{color:var(--sub);font-size:.92rem;margin:0}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.chip{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;min-height:44px}
.chip:disabled{opacity:.4;cursor:default}
.times .chip{padding:9px 4px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nav{background:none;border:1px solid var(--line);border-radius:8px;width:44px;height:44px;font-size:1.1rem}
.nav:disabled{opacity:.3;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.dow{color:var(--sub);font-size:.8rem;padding:4px 0}
.day{aspect-ratio:1;border:0;border-radius:8px;background:var(--soft);font-weight:600;min-width:0;padding:0}
.day:disabled{background:none;color:var(--sub);opacity:.45;font-weight:400;cursor:default}
.day[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
label{display:block;font-size:.9rem;font-weight:600;margin-top:12px}
input,textarea,select{display:block;width:100%;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:4px}
.primary{display:block;width:100%;margin-top:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:13px;font-weight:600}
.primary:disabled{opacity:.5;cursor:default}
.err{color:var(--err);font-size:.92rem;margin:10px 0 0}
.mute{color:var(--sub)}
a{color:var(--accent);word-break:break-all}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title">상담 예약</h1>
  <p class="sub" id="intro">불러오는 중입니다.</p>
  <p class="err" id="pageError" role="alert" hidden></p>

  <div id="booking" hidden>
    <section>
      <h2><label for="studentName" style="margin:0;font-size:1rem">1. 이름</label></h2>
      <input id="studentName" maxlength="30" required autocomplete="name">
    </section>
    <section>
      <h2>2. 상담 분류</h2>
      <div class="chips" id="categories"></div>
    </section>
    <section id="dateStep">
      <h2>3. 상담 날짜</h2>
      <p class="mute" id="slotState" hidden></p>
      <div id="calendar">
        <div class="head">
          <button class="nav" id="prev" type="button" aria-label="이전 달">‹</button>
          <strong id="month"></strong>
          <button class="nav" id="next" type="button" aria-label="다음 달">›</button>
        </div>
        <div class="grid" id="days"></div>
      </div>
    </section>
    <section id="lengthStep" hidden>
      <h2 id="lengthTitle">4. 상담 길이</h2>
      <div class="chips" id="durations"></div>
    </section>
    <section id="timeStep" hidden>
      <h2 id="timeTitle">5. 상담 시간</h2>
      <div class="times" id="times"></div>
    </section>
    <section id="formStep" hidden>
      <h2 id="formTitle">6. 학생 정보</h2>
      <form id="form">
        <label>학년<select name="grade" id="grade" required></select></label>
        <label>이메일<input name="email" type="email" maxlength="100" required autocomplete="email"></label>
        <label>상담 내용 (선택)<textarea name="memo" rows="3" maxlength="500"></textarea></label>
        <p class="sub" id="notice" style="margin-top:12px"></p>
        <p class="err" id="formError" role="alert" hidden></p>
        <button class="primary" id="submit" type="submit">예약 확정</button>
      </form>
    </section>
  </div>

  <section id="done" hidden>
    <h2>예약이 확정되었습니다</h2>
    <p id="doneText"></p>
    <p class="sub" id="doneMail"></p>
    <p class="sub" id="doneCancel" hidden>취소 링크: <a id="doneLink"></a></p>
  </section>

  <section id="cancel" hidden>
    <h2>상담 예약 취소</h2>
    <p id="cancelText">불러오는 중입니다.</p>
    <p class="err" id="cancelError" role="alert" hidden></p>
    <button class="primary" id="cancelButton" type="button" hidden>이 예약 취소</button>
  </section>
</main>
<script>
var state = { info: null, category: null, minutes: null, slots: null, year: 0, month: 0, date: null, time: null, loadId: 0 };
var $ = function (id) { return document.getElementById(id); };

// Apps Script 화면 안에서는 google.script.run을 쓰고, 개인 페이지에서는 같은 함수를 HTTP로 부른다.
// 개인 페이지 쪽은 구글 로그인 정보를 보내지 않으므로 여러 계정으로 로그인한 브라우저에서도 열린다.
var API_URL = 'https://script.google.com/macros/s/AKfycbwUbCOWCuKtOwQiNau8WHgI2ro647TskMdFibRl2jigJF8CCLOR-zOzd8F0Ae9pwPc/exec';
function inAppsScript() { return !!(window.google && google.script && google.script.run); }
function remote(name, args, ok, bad) {
  if (inAppsScript()) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(bad);
    r[name].apply(r, args);
    return;
  }
  fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: name, args: args }) })
    .then(function (res) { return res.json(); })
    .then(function (d) { if (d.ok) ok(d.result); else bad(new Error(d.error)); },
      function () { bad(new Error('예약 서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요.')); });
}
function pageParams(cb) {
  if (inAppsScript()) { google.script.url.getLocation(function (loc) { cb(loc.parameter || {}); }); return; }
  var p = {};
  // 관리 키는 서버 기록에 남지 않도록 주소의 # 뒤에 둔다.
  new URLSearchParams(location.search.slice(1) + '&' + location.hash.slice(1)).forEach(function (v, k) { p[k] = v; });
  setTimeout(function () { cb(p); }, 0);
}
function call(name, args, ok, bad) { remote(name, args, ok, bad); }
function message(e) { return String(e && e.message || e).replace(/^Error:\s*/, ''); }
function show(el, text) { el.textContent = text; el.hidden = !text; }

function chip(label, pressed, onClick) {
  var b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip';
  b.textContent = label;
  b.setAttribute('aria-pressed', String(pressed));
  b.onclick = onClick;
  return b;
}
function fill(box, items) {
  box.textContent = '';
  items.forEach(function (x) { box.appendChild(x); });
}
function durationText(m) { return m % 60 ? m + '분' : (m / 60) + '시간'; }
function dateText(d) {
  var p = d.split('-').map(Number);
  var w = '일월화수목금토'[new Date(Date.UTC(p[0], p[1] - 1, p[2])).getUTCDay()];
  return p[0] + '년 ' + p[1] + '월 ' + p[2] + '일 (' + w + ')';
}

function renderChoices() {
  fill($('categories'), state.info.categories.map(function (c) {
    return chip(c, c === state.category, function () { state.category = c; renderChoices(); });
  }));
}

/** 어떤 길이든 시작할 수 있는 시각이 있는 날짜만 고를 수 있다. */
function openDates() {
  var seen = {};
  Object.keys(state.slots || {}).forEach(function (m) {
    Object.keys(state.slots[m]).forEach(function (d) { seen[d] = true; });
  });
  return Object.keys(seen).sort();
}
function timesFor(m) { return (state.slots[m] || {})[state.date] || []; }
function endTime(start, minutes) {
  var p = start.split(':').map(Number);
  var t = p[0] * 60 + p[1] + minutes;
  return pad(Math.floor(t / 60)) + ':' + pad(t % 60);
}

function loadSlots(note) {
  var id = ++state.loadId;
  state.slots = null;
  state.date = state.time = state.minutes = null;
  $('calendar').hidden = true;
  show($('slotState'), '빈 시간을 확인하는 중입니다.');
  renderDetail();
  call('apiAllSlots', [], function (slots) {
    if (id !== state.loadId) return;
    state.slots = slots;
    var dates = openDates();
    if (!dates.length) {
      show($('slotState'), note || '지금은 예약할 수 있는 시간이 없습니다.');
      return;
    }
    show($('slotState'), note || '');
    var p = dates[0].split('-').map(Number);
    state.year = p[0];
    state.month = p[1] - 1;
    $('calendar').hidden = false;
    renderCalendar();
  }, function (e) {
    if (id === state.loadId) show($('slotState'), message(e));
  });
}

function pad(n) { return String(n).padStart(2, '0'); }
function monthKey(y, m) { return y + '-' + pad(m + 1); }

function renderCalendar() {
  var y = state.year, m = state.month;
  var dates = openDates();
  $('month').textContent = y + '년 ' + (m + 1) + '월';
  $('prev').disabled = monthKey(y, m) <= dates[0].slice(0, 7);
  $('next').disabled = monthKey(y, m) >= dates[dates.length - 1].slice(0, 7);
  var cells = '일월화수목금토'.split('').map(function (w) {
    var d = document.createElement('div');
    d.className = 'dow';
    d.textContent = w;
    return d;
  });
  var blanks = new Date(Date.UTC(y, m, 1)).getUTCDay();
  for (var i = 0; i < blanks; i++) cells.push(document.createElement('div'));
  var last = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  for (var d = 1; d <= last; d++) {
    (function (day) {
      var key = monthKey(y, m) + '-' + pad(day);
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'day';
      b.textContent = day;
      b.disabled = dates.indexOf(key) < 0;
      b.setAttribute('aria-pressed', String(key === state.date));
      b.onclick = function () {
        state.date = key;
        state.time = null;
        if (!timesFor(state.minutes).length) state.minutes = null;
        renderCalendar();
        renderDetail();
      };
      cells.push(b);
    })(d);
  }
  fill($('days'), cells);
}

function renderDetail() {
  var ready = !!(state.date && state.slots);
  $('lengthStep').hidden = !ready;
  if (ready) $('lengthTitle').textContent = '4. ' + dateText(state.date) + ' 상담 길이';
  fill($('durations'), ready ? state.info.durations.map(function (m) {
    var b = chip(durationText(m), m === state.minutes, function () {
      state.minutes = m;
      state.time = null;
      renderDetail();
    });
    b.disabled = !timesFor(m).length;
    return b;
  }) : []);
  var times = ready && state.minutes ? timesFor(state.minutes) : [];
  $('timeStep').hidden = !times.length;
  fill($('times'), times.map(function (t) {
    return chip(t + '~' + endTime(t, state.minutes), t === state.time, function () { state.time = t; renderDetail(); });
  }));
  $('formStep').hidden = !state.time;
}

$('prev').onclick = function () {
  if (--state.month < 0) { state.month = 11; state.year--; }
  renderCalendar();
};
$('next').onclick = function () {
  if (++state.month > 11) { state.month = 0; state.year++; }
  renderCalendar();
};

$('form').onsubmit = function (ev) {
  ev.preventDefault();
  show($('formError'), '');
  var name = $('studentName').value.trim();
  if (!name) { show($('formError'), '이름을 입력해 주세요.'); $('studentName').focus(); return; }
  if (!state.category) { show($('formError'), '상담 분류를 선택해 주세요.'); return; }
  var f = ev.target;
  $('submit').disabled = true;
  $('submit').textContent = '예약하는 중입니다';
  call('apiBook', [{
    category: state.category, minutes: state.minutes, date: state.date, time: state.time,
    name: name, grade: f.grade.value, email: f.email.value, memo: f.memo.value
  }], function (r) {
    $('booking').hidden = true;
    $('done').hidden = false;
    $('doneText').textContent = dateText(r.date) + ' ' + r.time + ', ' + durationText(r.minutes) + ', ' + r.category +
      (r.location ? ', ' + r.location : '');
    $('doneMail').textContent = r.mailSent ? '확인 메일을 보냈습니다. 취소 링크는 메일에 있습니다.' : '확인 메일을 보내지 못했습니다. 아래 취소 링크를 저장해 두세요.';
    if (r.cancelUrl) {
      $('doneCancel').hidden = false;
      $('doneLink').href = r.cancelUrl;
      $('doneLink').textContent = r.cancelUrl;
    }
  }, function (e) {
    $('submit').disabled = false;
    $('submit').textContent = '예약 확정';
    var text = message(e);
    if (text.indexOf('다른 시간') >= 0) {
      loadSlots(text);
    } else {
      show($('formError'), text);
    }
  });
};

function startCancel(token) {
  $('intro').hidden = true;
  $('cancel').hidden = false;
  call('apiCancelInfo', [token], function (b) {
    $('cancelText').textContent = dateText(b.date) + ' ' + b.time + ', ' + durationText(b.minutes) + ', ' + b.category;
    if (b.status !== '확정') show($('cancelError'), '이미 취소된 예약입니다.');
    else if (b.past) show($('cancelError'), '이미 시작한 상담은 취소할 수 없습니다.');
    else $('cancelButton').hidden = false;
  }, function (e) {
    $('cancelText').textContent = '';
    show($('cancelError'), message(e));
  });
  $('cancelButton').onclick = function () {
    $('cancelButton').disabled = true;
    call('apiCancel', [token], function () {
      $('cancelButton').hidden = true;
      $('cancelText').textContent = '예약을 취소했습니다.';
    }, function (e) {
      $('cancelButton').disabled = false;
      show($('cancelError'), message(e));
    });
  };
}

call('apiInfo', [], function (info) {
  state.info = info;
  $('title').textContent = info.title;
  document.title = info.title;
  $('intro').textContent = info.intro;
  $('notice').textContent = info.privacyNotice;
  fill($('grade'), [''].concat(info.grades).map(function (g) {
    var o = document.createElement('option');
    o.value = g;
    o.textContent = g || '선택해 주세요';
    return o;
  }));
  pageParams(function (params) {
    if (params.cancel) {
      startCancel(params.cancel);
      return;
    }
    $('booking').hidden = false;
    renderChoices();
    loadSlots();
  });
}, function (e) {
  $('intro').textContent = '';
  show($('pageError'), message(e));
});
</script>
</body>
</html>
